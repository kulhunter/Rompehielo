<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ROMPEHIELO</title>
  <meta name="description" content="Rompehielo — preguntas que generan conversación real. Sin estrés, sin filtro, con inteligencia.">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== PANTALLA 1: BIENVENIDA + ONBOARDING CONVERSACIONAL ===== -->
  <section id="screenOnboarding" class="screen screen-onboarding active">
    <div class="onboarding-container">

      <!-- Logo y tagline -->
      <div class="brand-header" id="brandHeader">
        <div class="brand-icon">🧊</div>
        <h1 class="brand-title">ROMPEHIELO</h1>
        <p class="brand-tagline">Preguntas que generan conversación real</p>
      </div>

      <!-- Chat conversacional -->
      <div class="chat-area" id="chatArea">
        <!-- Los mensajes se agregan dinámicamente -->
      </div>

      <!-- Input del usuario -->
      <div class="chat-input-area" id="chatInputArea">
        <div class="chat-input-wrap">
          <input type="text" id="chatInput" placeholder="Escribe aquí..." autocomplete="off" enterkeyhint="send">
          <button id="chatSendBtn" class="chat-send-btn" aria-label="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
        <!-- Opciones rápidas (se renderizan dinámicamente) -->
        <div class="quick-options" id="quickOptions"></div>
      </div>

    </div>
  </section>

  <!-- ===== PANTALLA 2: EL JUEGO DE CARTAS ===== -->
  <section id="screenGame" class="screen screen-game">
    <div class="game-container">

      <!-- Turn indicator -->
      <div class="turn-indicator" id="turnIndicator">
        <div class="turn-label">TURNO DE</div>
        <div class="turn-name" id="turnName">—</div>
        <div class="turn-progress">
          <div class="progress-dots" id="progressDots"></div>
        </div>
      </div>

      <!-- 3D Flip Card -->
      <div class="card-arena">
        <div class="card-3d-wrapper" id="card3D">

          <!-- FRONT -->
          <article class="card-face card-front" id="cardFront">
            <div class="card-corner-tag">
              <span class="tag-category" id="cardCategory">💬</span>
              <span class="tag-depth" id="cardDepth">SUAVE</span>
            </div>
            <div class="card-question-box">
              <h1 class="card-quote" id="cardQuestion">Toca para comenzar</h1>
            </div>
            <div class="card-footer">
              <span class="card-hint">TOCA PARA VOLTEAR</span>
              <span class="card-number" id="cardNumber">#01</span>
            </div>
          </article>

          <!-- BACK -->
          <article class="card-face card-back">
            <div class="card-corner-tag">
              <span class="tag-category text-gold">✦ TIRA DEL HILO</span>
              <span class="tag-depth">PROFUNDIZA</span>
            </div>
            <div class="card-question-box">
              <h2 class="card-quote card-followup" id="cardFollowUp">¿Por qué crees eso?</h2>
            </div>
            <div class="card-footer">
              <span class="card-hint">TOCA PARA VOLVER</span>
              <span class="card-number">🔥</span>
            </div>
          </article>

        </div>
      </div>

      <!-- Action buttons -->
      <div class="game-actions">
        <button class="action-btn btn-restart" id="btnRestart" aria-label="Reiniciar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="action-btn btn-next" id="btnNext">
          <span>Siguiente</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
